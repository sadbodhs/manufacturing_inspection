<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="Helvetica, Arial, sans-serif">
  <title>The three-stage inspection pipeline, with the page that measures each part</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5f6368"/>
    </marker>
    <marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8710a"/>
    </marker>
  </defs>
  <rect width="960" height="400" fill="#ffffff"/>

  <!-- Camera -->
  <rect x="20" y="70" width="120" height="86" rx="8" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.5"/>
  <text x="80" y="104" text-anchor="middle" font-size="15" font-weight="bold" fill="#202124">Line camera</text>
  <text x="80" y="124" text-anchor="middle" font-size="12" fill="#5f6368">30 fps per camera</text>
  <text x="80" y="141" text-anchor="middle" font-size="12" fill="#5f6368">N cameras</text>

  <line x1="140" y1="113" x2="186" y2="113" stroke="#5f6368" stroke-width="2" marker-end="url(#ah)"/>
  <text x="163" y="104" text-anchor="middle" font-size="11" fill="#5f6368">frame</text>

  <!-- Stage 1 -->
  <rect x="190" y="56" width="190" height="114" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="285" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a73e8">STAGE 1 · LOCATE</text>
  <text x="285" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#202124">yolov8s at 640</text>
  <text x="285" y="123" text-anchor="middle" font-size="12" fill="#5f6368">finds and crops each part</text>
  <text x="285" y="140" text-anchor="middle" font-size="12" fill="#5f6368">every frame</text>
  <text x="285" y="158" text-anchor="middle" font-size="12" fill="#202124">~1.3 ms (measured)</text>

  <line x1="380" y1="113" x2="426" y2="113" stroke="#5f6368" stroke-width="2" marker-end="url(#ah)"/>
  <text x="403" y="104" text-anchor="middle" font-size="11" fill="#5f6368">K crops</text>

  <!-- Stage 2 -->
  <rect x="430" y="56" width="220" height="114" rx="8" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/>
  <text x="540" y="82" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a73e8">STAGE 2 · JUDGE</text>
  <text x="540" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#202124">anomaly model</text>
  <text x="540" y="123" text-anchor="middle" font-size="12" fill="#5f6368">trained on good parts only</text>
  <text x="540" y="140" text-anchor="middle" font-size="12" fill="#5f6368">every crop · K crops = one batch</text>
  <text x="540" y="158" text-anchor="middle" font-size="12" fill="#202124">0.3–1.3 ms per crop at 256</text>

  <line x1="650" y1="113" x2="726" y2="113" stroke="#5f6368" stroke-width="2" marker-end="url(#ah)"/>
  <text x="688" y="104" text-anchor="middle" font-size="11" fill="#5f6368">score</text>

  <!-- Decision -->
  <rect x="730" y="70" width="210" height="86" rx="8" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.5"/>
  <text x="835" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#202124">pass / flag</text>
  <text x="835" y="120" text-anchor="middle" font-size="12" fill="#5f6368">most parts pass here,</text>
  <text x="835" y="137" text-anchor="middle" font-size="12" fill="#5f6368">in real time</text>

  <!-- Rare path -->
  <path d="M 835 156 L 835 236 L 686 236" fill="none" stroke="#e8710a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#aho)"/>
  <text x="845" y="200" font-size="12" fill="#e8710a" font-weight="bold">fraction p of</text>
  <text x="845" y="216" font-size="12" fill="#e8710a" font-weight="bold">flagged crops</text>

  <!-- Stage 3 -->
  <rect x="430" y="196" width="252" height="104" rx="8" fill="#fef3e8" stroke="#e8710a" stroke-width="2"/>
  <text x="556" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#e8710a">STAGE 3 · EXPLAIN (async)</text>
  <text x="556" y="244" text-anchor="middle" font-size="14" font-weight="bold" fill="#202124">open-vocabulary model</text>
  <text x="556" y="263" text-anchor="middle" font-size="12" fill="#5f6368">"scratch", "dent", "missing screw"</text>
  <text x="556" y="282" text-anchor="middle" font-size="12" fill="#5f6368">names or outlines it · ~10 ms per crop</text>

  <line x1="430" y1="248" x2="340" y2="248" stroke="#e8710a" stroke-width="2" marker-end="url(#aho)"/>
  <rect x="190" y="218" width="146" height="60" rx="8" fill="#f1f3f4" stroke="#9aa0a6" stroke-width="1.5"/>
  <text x="263" y="243" text-anchor="middle" font-size="13" font-weight="bold" fill="#202124">operator /</text>
  <text x="263" y="261" text-anchor="middle" font-size="13" font-weight="bold" fill="#202124">defect log</text>

  <!-- Experiment tags -->
  <text x="20" y="30" font-size="13" font-weight="bold" fill="#202124">Which page measures which part</text>
  <g font-size="12" fill="#202124">
    <rect x="430" y="176" width="220" height="1" fill="none"/>
    <text x="540" y="46" text-anchor="middle" fill="#1a73e8">which encoders · map or score · PatchCore's search · embedding search</text>
    <text x="556" y="318" text-anchor="middle" fill="#e8710a">do big models batch · Grounding DINO on TensorRT</text>
  </g>
  <rect x="20" y="340" width="920" height="44" rx="8" fill="#ffffff" stroke="#1a73e8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="480" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#202124">under live load: the whole line with virtual 30 fps cameras</text>
  <text x="480" y="377" text-anchor="middle" font-size="12" fill="#5f6368">do the K crops batch well? does the rare heavy stage slow the fast path?</text>
</svg>
